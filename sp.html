<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjustable Free-Floating Stick Figure Physics Sandpit</title>
    <!-- Tailwind CSS for modern UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Matter.js Physics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
        }
        canvas {
            display: block;
            touch-action: none;
            width: 100% !important;
            height: 100% !important;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        input[type="range"] {
            accent-color: #6366f1;
        }
        .sidebar-transition {
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col md:flex-row select-none overflow-hidden">

    <!-- Left Sidebar: Controls for limb mass, rod length, angle, and central hub mass -->
    <aside id="config-sidebar" class="sidebar-transition glass-panel absolute md:relative top-0 left-0 z-20 w-full md:w-72 lg:w-80 h-auto md:h-full p-3 flex flex-col gap-2.5 border-b md:border-b-0 md:border-r border-slate-800 overflow-y-auto shadow-2xl shrink-0">
        <!-- Status Header -->
        <div class="flex items-center justify-between pb-1 border-b border-slate-800">
            <span id="active-limb-title" class="text-xs font-bold text-rose-400 flex items-center gap-1.5">
                <i class="fa-solid fa-circle text-[8px]"></i> 1. Head
            </span>
            <span id="instability-badge" class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">FLOATING</span>
        </div>

        <!-- Central Hub Mass Card -->
        <div class="space-y-1.5 bg-indigo-950/40 p-2.5 rounded-xl border border-indigo-500/30">
            <div class="flex justify-between text-[11px] text-indigo-300 font-medium">
                <span>Central Hub Mass:</span> <span id="val-hub-weight" class="font-bold text-white">4.0 kg</span>
            </div>
            <input type="range" id="hub-weight" min="1" max="40" step="1" value="4" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer" oninput="onHubWeightChange()">
        </div>

        <!-- Single Remapped Sliders Card -->
        <div class="space-y-2.5 bg-slate-900/90 p-3 rounded-xl border border-slate-700/60 shadow-inner">
            <!-- Slider 1: Mass & Size Proportional -->
            <div class="space-y-0.5">
                <div class="flex justify-between text-[11px] text-slate-300 font-medium">
                    <span>Limb Mass & Size:</span> <span id="val-weight-active" class="font-bold text-white">5.0 kg</span>
                </div>
                <input type="range" id="weight-active" min="0.5" max="30" step="0.5" value="5" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer" oninput="onSliderChange()">
            </div>

            <!-- Slider 2: Rod Length -->
            <div class="space-y-0.5">
                <div class="flex justify-between text-[11px] text-slate-300 font-medium">
                    <span>Rod Length:</span> <span id="val-len-active" class="font-bold text-white">80 px</span>
                </div>
                <input type="range" id="len-active" min="40" max="180" step="5" value="80" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer" oninput="onSliderChange()">
            </div>

            <!-- Slider 3: Angle Offset (Degrees) -->
            <div class="space-y-0.5">
                <div class="flex justify-between text-[11px] text-slate-300 font-medium">
                    <span>Angle Offset:</span> <span id="val-ang-active" class="font-bold text-white">0°</span>
                </div>
                <input type="range" id="ang-active" min="-90" max="90" step="1" value="0" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer" oninput="onSliderChange()">
            </div>
        </div>

        <!-- Minimal Action Controls -->
        <div class="flex items-center gap-2 pt-1 mt-auto">
            <button onclick="resetSimulation()" class="flex-1 py-1.5 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition shadow flex items-center justify-center gap-1">
                <i class="fa-solid fa-rotate-right"></i> Reset
            </button>
            <button onclick="dropDisturbance()" class="flex-1 py-1.5 text-xs font-semibold bg-amber-600 hover:bg-amber-500 text-white rounded-lg transition shadow flex items-center justify-center gap-1">
                <i class="fa-solid fa-meteor"></i> Drop Weight
            </button>
        </div>
    </aside>

    <!-- Right Sandbox Canvas Container -->
    <main id="canvas-container" class="relative flex-1 w-full h-[70vh] md:h-full cursor-crosshair overflow-hidden bg-[#0b0f19]">
        <!-- Top-Right Floating Toggle Controls Button -->
        <div class="absolute top-3 right-3 z-10">
            <button onclick="toggleConfigPanel()" id="toggle-config-btn" class="glass-panel px-3 py-1.5 text-xs font-semibold text-slate-200 hover:text-white rounded-lg shadow-xl transition flex items-center gap-1.5 border border-slate-700">
                <i class="fa-solid fa-sliders text-indigo-400"></i> <span id="config-btn-text">Hide Controls</span>
            </button>
        </div>

        <!-- HUD Overlay -->
        <div id="hud" class="absolute bottom-3 left-3 z-10 pointer-events-none glass-panel px-3 py-1.5 rounded-lg text-[11px] flex flex-wrap gap-2.5 text-slate-300 shadow-xl">
            <div>Status: <span id="stat-status" class="font-bold text-indigo-400">Free-Floating Tumble</span></div>
            <div>FPS: <span id="stat-fps" class="font-bold text-emerald-400">60</span></div>
            <div class="text-slate-400 italic">Tap any limb to inspect & adjust</div>
        </div>
    </main>

    <script>
        // Module aliases
        const { Engine, Render, Runner, Bodies, Body, Composite, Constraint, Mouse, MouseConstraint } = Matter;

        let engine, render, runner;
        let figureComposite = null;
        let figureMainBody = null; 
        let selectedLimbIndex = 1;
        let hubWeight = 4.0;
        let isConfigVisible = true;
        
        // Data store for the 5 limbs
        const limbData = {
            1: { weight: 5.0, len: 80, ang: 0, baseAngle: -Math.PI / 2, color: '#f43f5e', name: 'Head' },
            2: { weight: 5.0, len: 120, ang: 0, baseAngle: 0, color: '#3b82f6', name: 'Right Arm' },
            3: { weight: 5.0, len: 120, ang: 0, baseAngle: Math.PI / 2, color: '#10b981', name: 'Arm 3' },
            4: { weight: 5.0, len: 120, ang: 0, baseAngle: Math.PI, color: '#f59e0b', name: 'Left Arm' },
            5: { weight: 5.0, len: 100, ang: 0, baseAngle: -3 * Math.PI / 4, color: '#c084fc', name: 'Feet / Base' }
        };

        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 60;

        function initPhysics() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            // Create engine with standard gravity
            engine = Engine.create();
            engine.world.gravity.y = 1.0;

            // Create renderer
            render = Render.create({
                element: container,
                engine: engine,
                options: {
                    width: width,
                    height: height,
                    wireframes: false,
                    background: '#0b0f19'
                }
            });

            Render.run(render);

            // Create runner
            runner = Runner.create();
            Runner.run(runner, engine);

            // Create boundaries (floor, walls) with visible ground
            createBoundaries(width, height);

            // Build initial unpinned free-floating stick figure structure positioned safely above ground
            buildStickFigure(width / 2, height / 2 - 120);

            // Add mouse control for interacting with bodies
            const mouse = Mouse.create(render.canvas);
            const mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: {
                    stiffness: 0.2,
                    render: { visible: true, strokeStyle: '#6366f1', lineWidth: 2 }
                }
            });
            Composite.add(engine.world, mouseConstraint);
            render.mouse = mouse;

            // Listen for direct taps on canvas to select limbs by clicking on them
            render.canvas.addEventListener('pointerdown', (event) => {
                const rect = render.canvas.getBoundingClientRect();
                const clickX = event.clientX - rect.left;
                const clickY = event.clientY - rect.top;
                checkLimbSelection(clickX, clickY);
            });

            // Handle window resizing
            window.addEventListener('resize', handleResize);

            // Start HUD update loop
            requestAnimationFrame(updateHUD);
        }

        function createBoundaries(width, height) {
            const wallOptions = {
                isStatic: true,
                render: { fillStyle: '#1e293b', strokeStyle: '#334155', lineWidth: 2 },
                friction: 0.8,
                restitution: 0.4
            };

            const thickness = 60;
            const ground = Bodies.rectangle(width / 2, height - thickness / 2, width + 200, thickness, wallOptions);
            const leftWall = Bodies.rectangle(-thickness / 2 + 10, height / 2, thickness, height + 200, wallOptions);
            const rightWall = Bodies.rectangle(width + thickness / 2 - 10, height / 2, thickness, height + 200, wallOptions);
            const ceiling = Bodies.rectangle(width / 2, -thickness / 2 + 10, width + 200, thickness, wallOptions);

            Composite.add(engine.world, [ground, leftWall, rightWall, ceiling]);
        }

        function buildStickFigure(cx, cy) {
            figureComposite = Composite.create({ label: 'FreeStickFigure' });

            const hubRadius = 22;
            const hub = Bodies.circle(cx, cy, hubRadius, {
                mass: hubWeight,
                label: 'hub',
                render: { fillStyle: '#6366f1', strokeStyle: '#ffffff', lineWidth: 2 }
            });

            const children = [hub];

            for (let i = 1; i <= 5; i++) {
                const limb = limbData[i];
                const angle = limb.baseAngle + (limb.ang * Math.PI / 180);
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);

                const rodLen = limb.len;
                const rodX = cx + (cos * rodLen) / 2;
                const rodY = cy + (sin * rodLen) / 2;
                
                const rod = Bodies.rectangle(rodX, rodY, rodLen, 14, {
                    angle: angle,
                    chamfer: { radius: 3 },
                    label: `rod-${i}`,
                    render: { fillStyle: selectedLimbIndex === i ? '#38bdf8' : '#475569', strokeStyle: selectedLimbIndex === i ? '#ffffff' : '#334155', lineWidth: selectedLimbIndex === i ? 3 : 1 }
                });

                const tipRadius = Math.max(10, Math.min(45, 10 + limb.weight * 1.4));
                const tipX = cx + cos * rodLen;
                const tipY = cy + sin * rodLen;
                
                const tip = Bodies.circle(tipX, tipY, tipRadius, {
                    mass: limb.weight,
                    label: `tip-${i}`,
                    render: { fillStyle: limb.color, strokeStyle: selectedLimbIndex === i ? '#ffffff' : '#cbd5e1', lineWidth: selectedLimbIndex === i ? 4 : 2 }
                });

                children.push(rod, tip);
            }

            // Create free-floating compound body
            figureMainBody = Body.create({
                parts: children,
                frictionAir: 0.01,
                restitution: 0.3
            });

            Composite.add(figureComposite, figureMainBody);
            Composite.add(engine.world, figureComposite);
        }

        function checkLimbSelection(x, y) {
            if (!figureMainBody) return;
            const parts = figureMainBody.parts;
            for (let i = 1; i < parts.length; i++) {
                const part = parts[i];
                const label = part.label;
                if (label && label.includes('-')) {
                    const id = parseInt(label.split('-')[1]);
                    const dx = part.position.x - x;
                    const dy = part.position.y - y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 45) {
                        selectLimb(id);
                        return;
                    }
                }
            }
        }

        function selectLimb(id) {
            selectedLimbIndex = id;

            const limb = limbData[id];
            document.getElementById('weight-active').value = limb.weight;
            document.getElementById('len-active').value = limb.len;
            document.getElementById('ang-active').value = limb.ang;

            document.getElementById('val-weight-active').innerText = limb.weight + ' kg';
            document.getElementById('val-len-active').innerText = limb.len + ' px';
            document.getElementById('val-ang-active').innerText = limb.ang + '°';

            const titleEl = document.getElementById('active-limb-title');
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#c084fc'];
            titleEl.style.color = colors[id - 1];
            titleEl.innerHTML = `<i class="fa-solid fa-circle text-[8px]"></i> ${id}. ${limb.name}`;

            updateFigureParameters();
        }

        function onHubWeightChange() {
            hubWeight = parseFloat(document.getElementById('hub-weight').value);
            document.getElementById('val-hub-weight').innerText = hubWeight + ' kg';
            updateFigureParameters();
        }

        function onSliderChange() {
            const w = parseFloat(document.getElementById('weight-active').value);
            const l = parseFloat(document.getElementById('len-active').value);
            const a = parseFloat(document.getElementById('ang-active').value);

            limbData[selectedLimbIndex].weight = w;
            limbData[selectedLimbIndex].len = l;
            limbData[selectedLimbIndex].ang = a;

            document.getElementById('val-weight-active').innerText = w + ' kg';
            document.getElementById('val-len-active').innerText = l + ' px';
            document.getElementById('val-ang-active').innerText = a + '°';

            updateFigureParameters();
        }

        function updateFigureParameters() {
            if (figureMainBody) {
                const currentPos = { x: figureMainBody.position.x, y: figureMainBody.position.y };
                const currentVel = { x: figureMainBody.velocity.x, y: figureMainBody.velocity.y };
                const currentAngVel = figureMainBody.angularVelocity;
                
                Composite.remove(engine.world, figureComposite);
                buildStickFigure(currentPos.x, currentPos.y);

                // Preserve momentum / velocity through parameter edits safely
                Body.setVelocity(figureMainBody, currentVel);
                Body.setAngularVelocity(figureMainBody, currentAngVel);
            }
        }

        function resetSimulation() {
            Composite.remove(engine.world, figureComposite);
            const container = document.getElementById('canvas-container');
            buildStickFigure(container.clientWidth / 2, container.clientHeight / 2 - 120);
        }

        function dropDisturbance() {
            if (!figureMainBody) return;
            const dropX = figureMainBody.position.x + (Math.random() > 0.5 ? 140 : -140);
            const dropY = figureMainBody.position.y - 180;
            const distBall = Bodies.circle(dropX, dropY, 22, {
                mass: 12.0,
                friction: 0.1,
                restitution: 0.7,
                render: { fillStyle: '#e11d48', strokeStyle: '#ffffff', lineWidth: 2 }
            });
            Composite.add(engine.world, distBall);
        }

        function toggleConfigPanel() {
            const sidebar = document.getElementById('config-sidebar');
            const btnText = document.getElementById('config-btn-text');
            isConfigVisible = !isConfigVisible;

            if (isConfigVisible) {
                sidebar.style.transform = 'translateX(0)';
                sidebar.style.opacity = '1';
                sidebar.style.pointerEvents = 'auto';
                btnText.innerText = 'Hide Controls';
            } else {
                sidebar.style.transform = 'translateX(-110%)';
                sidebar.style.opacity = '0';
                sidebar.style.pointerEvents = 'none';
                btnText.innerText = 'Show Controls';
            }
            setTimeout(handleResize, 300);
        }

        function handleResize() {
            const container = document.getElementById('canvas-container');
            if (!container || !render) return;
            render.options.width = container.clientWidth;
            render.options.height = container.clientHeight;
            render.canvas.width = container.clientWidth;
            render.canvas.height = container.clientHeight;
        }

        function updateHUD(timestamp) {
            frameCount++;
            if (timestamp - lastTime >= 1000) {
                fps = Math.round((frameCount * 1000) / (timestamp - lastTime));
                frameCount = 0;
                lastTime = timestamp;
                document.getElementById('stat-fps').innerText = fps;
            }

            if (figureMainBody) {
                const speed = Math.sqrt(figureMainBody.velocity.x ** 2 + figureMainBody.velocity.y ** 2);
                const statusEl = document.getElementById('stat-status');
                if (speed > 1.5) {
                    statusEl.innerText = 'Tumbling / Falling';
                    statusEl.className = 'font-bold text-amber-400';
                } else {
                    statusEl.innerText = 'Free-Floating Grounded';
                    statusEl.className = 'font-bold text-emerald-400';
                }
            }

            requestAnimationFrame(updateHUD);
        }

        window.onload = function() {
            initPhysics();
        };
    </script>
</body>
</html>
